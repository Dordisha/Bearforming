name: Bearforming
options:
  bundleIdPrefix: com.doriandishani
  deploymentTarget:
    iOS: '17.0'
packages:
  FitnessCore:
    path: .
targets:
  Bearforming:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: FitnessCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doriandishani.bearforming
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bearforming
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
